<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectMatch - Blogs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="blog.css">
</head>
<body>
<div id="site-nav"></div>
<main class="wrap">
  <h1>Blogs</h1>
  <p class="sub">Read what students are writing.</p>
  <p style="margin-bottom:24px"><a class="btn" href="write.html">Write a blog</a></p>
  <div class="filters">
    <input id="q" type="search" placeholder="Search by title or content" aria-label="Search blogs">
    <select id="cat" aria-label="Filter by category"></select>
  </div>
  <div id="list"><p class="msg">Loading blogs...</p></div>
</main>
<script src="blog-common.js"></script>
<script>
renderNav('blogs.html');
var list = document.getElementById('list');
var q = document.getElementById('q');
var cat = document.getElementById('cat');
var latest = 0, timer = null;
fillCategories(cat, 'All categories');

function load() {
  var n = ++latest;
  var params = new URLSearchParams();
  if (q.value.trim()) params.set('search', q.value.trim());
  if (cat.value) params.set('category', cat.value);

  fetch(API + '/blogs?' + params.toString())
    .then(function (r) { if (!r.ok) throw new Error('bad response'); return r.json(); })
    .then(function (blogs) {
      if (n !== latest) return;            // ignore out-of-date responses
      list.textContent = '';
      if (!blogs.length) {
        list.innerHTML = '<p class="msg">No blogs found.</p>';
        return;
      }
      blogs.forEach(function (b) {
        var card = document.createElement('a');
        card.className = 'card';
        card.href = 'blog.html?id=' + encodeURIComponent(b._id);
        var h = document.createElement('h2');
        h.textContent = b.title;
        var tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = b.category || 'Other';
        h.appendChild(tag);
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = 'By ' + (b.author && b.author.name ? b.author.name : 'Unknown') + ' · ' + fmtDate(b.createdAt);
        var p = document.createElement('p');
        p.textContent = b.content.length > 160 ? b.content.slice(0, 160) + '…' : b.content;
        card.appendChild(h); card.appendChild(meta); card.appendChild(p);
        list.appendChild(card);
      });
    })
    .catch(function () {
      if (n === latest) list.innerHTML = '<p class="msg">Cannot load blogs. Is the server running?</p>';
    });
}

q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(load, 300); });
cat.addEventListener('change', load);
load();
</script>
</body>
</html>
