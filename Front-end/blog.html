<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectMatch - Blog</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f8f4;--card:#fff;--ink:#1c2420;--muted:#5b625d;--border:#e3e3dc;--green:#6b7f68;--error:#b3402f;--serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.navbar{border-bottom:1px solid var(--border)}
.nav{max-width:1112px;margin:0 auto;height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:19px;font-weight:600}
.navlinks{display:flex;gap:24px}.navlinks a{color:var(--muted);padding:8px 0}
.navlinks a.active{color:var(--ink);font-weight:500;box-shadow:0 2px 0 var(--green)}
.who{font-size:14px;color:var(--muted)}.who a{text-decoration:underline}
.wrap{max-width:760px;margin:0 auto;padding:40px 16px 64px}
h1{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1.2;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:22px 24px;margin-bottom:16px;display:block}
.card:hover{border-color:var(--green)}
.card h2{font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:4px}
.meta{color:var(--muted);font-size:13px;margin-bottom:10px}
.card p{color:var(--muted)}
.btn{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.6}
.msg{color:var(--muted);padding:24px 0}
.err{color:var(--error);font-size:13px;margin:8px 0}.err:empty{display:none}
.field{margin-bottom:16px}label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
input,textarea{width:100%;font:inherit;font-size:14px;background:#fff;border:1px solid var(--border);border-radius:5px;padding:10px 12px}
textarea{min-height:240px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{outline:2px solid rgba(107,127,104,.35);border-color:var(--green)}
.body{white-space:pre-wrap;font-size:17px;line-height:1.7;margin-top:24px}
.back{display:inline-block;color:var(--muted);font-size:14px;margin-bottom:20px}.back:hover{color:var(--ink)}
@media(max-width:760px){.navlinks{display:none}h1{font-size:28px}}
.filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.filters input{flex:1;min-width:200px}
select{font:inherit;font-size:14px;background:#fff;border:1px solid var(--border);border-radius:5px;padding:10px 12px}
.field select{width:100%}
.tag{display:inline-block;background:#eef2ec;color:var(--green);border-radius:4px;padding:2px 8px;font-size:12px;font-weight:500;margin-left:8px;vertical-align:middle}
.tools{display:flex;gap:10px;margin-top:28px}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
.btn-danger{background:#fff;color:var(--error);border:1px solid var(--error)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:18px 20px}
.stat span{display:block;color:var(--muted);font-size:13px}
.stat b{font-family:var(--serif);font-size:30px;font-weight:600}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:start}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.head h2{font-size:18px;font-weight:600}
.row{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.row h3{font-size:15px;font-weight:600}
.row .acts{display:flex;gap:8px;flex-shrink:0}
.btn-sm{padding:6px 12px;font-size:13px}
.acct p{margin-bottom:8px;font-size:14px}.acct p span{color:var(--muted)}
.logout{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;margin-left:12px}
@media(max-width:760px){.stats,.cols{grid-template-columns:1fr}}

/* Shared by every page: fixed (sticky) navbar and a phone-friendly menu */
.navbar, .site-header { position: sticky; top: 0; z-index: 100; background: #f8f8f4; }
@media (max-width: 900px) {
  .nav { height: auto; flex-wrap: wrap; row-gap: 4px; padding: 10px 16px; }
  .navlinks { display: flex; order: 3; width: 100%; gap: 20px; overflow-x: auto; white-space: nowrap; }
}
</style>
</head>
<body>
<div id="site-nav"></div>
<main class="wrap">
  <a class="back" href="blogs.html">← All blogs</a>
  <div id="post"><p class="msg">Loading...</p></div>
</main>
<script src="config.js"></script>
<script src="blog-common.js"></script>
<script>
renderNav('blogs.html');
var box = document.getElementById('post');
var id = new URLSearchParams(location.search).get('id');

function show(b) {
  document.title = b.title + ' - ProjectMatch';
  box.textContent = '';
  var h = document.createElement('h1');
  h.textContent = b.title;
  var meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = 'By ' + (b.author && b.author.name ? b.author.name : 'Unknown') + ' · ' + fmtDate(b.createdAt);
  var tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = b.category || 'Other';
  meta.appendChild(tag);
  var body = document.createElement('div');
  body.className = 'body';
  body.textContent = b.content;
  box.appendChild(h); box.appendChild(meta); box.appendChild(body);

  // Edit / Delete only for the author (the server checks this again)
  if (b.author && b.author._id && b.author._id === myId()) {
    var tools = document.createElement('div');
    tools.className = 'tools';
    var edit = document.createElement('a');
    edit.className = 'btn btn-ghost';
    edit.href = 'write.html?id=' + encodeURIComponent(b._id);
    edit.textContent = 'Edit';
    var del = document.createElement('button');
    del.className = 'btn btn-danger';
    del.type = 'button';
    del.textContent = 'Delete';
    del.addEventListener('click', function () { removeBlog(b._id, del); });
    tools.appendChild(edit); tools.appendChild(del);
    box.appendChild(tools);
  }
}

async function removeBlog(blogId, btn) {
  if (!confirm('Delete this blog? This cannot be undone.')) return;
  btn.disabled = true;
  try {
    var res = await fetch(API + '/blogs/' + encodeURIComponent(blogId), {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    if (!res.ok) {
      var data = await res.json();
      alert(data.message || 'Could not delete this blog.');
      btn.disabled = false;
      return;
    }
    location.href = 'blogs.html';
  } catch (e) {
    alert('Cannot reach the server. Is it running?');
    btn.disabled = false;
  }
}

if (!id) {
  box.innerHTML = '<p class="msg">No blog selected.</p>';
} else {
  fetch(API + '/blogs/' + encodeURIComponent(id))
    .then(function (r) {
      if (r.status === 404) throw new Error('missing');
      if (!r.ok) throw new Error('bad response');
      return r.json();
    })
    .then(show)
    .catch(function (e) {
      box.innerHTML = e.message === 'missing'
        ? '<p class="msg">This blog does not exist.</p>'
        : '<p class="msg">Cannot load this blog. Is the server running?</p>';
    });
}
</script>
<script src="site.js"></script>
</body>
</html>
